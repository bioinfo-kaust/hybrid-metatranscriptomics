report_comment: >
  This report has been generated by the <a href="https://github.com/bioinfo-kaust/hybrid-metatranscriptomics" target="_blank">bioinfo-kaust/hybrid-metatranscriptomics</a>
  analysis pipeline.
report_section_order:
  "bioinfo-kaust-hybrid-metatranscriptomics-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "bioinfo-kaust-hybrid-metatranscriptomics-summary":
    order: -1002

export_plots: true

disable_version_detection: true

# Sample names: use extra_fn_clean_exts (appends) and never fn_clean_exts (replaces MultiQC's
# defaults, which would leave names like "S01_Control_B.Log.final.out").
extra_fn_clean_exts:
  - "_1.merged"
  - "_2.merged"
  - ".merged"
  - ".fastp"
  - ".bbduk"
  - ".rrna_clean"
  - ".clean"
  - "_001"
