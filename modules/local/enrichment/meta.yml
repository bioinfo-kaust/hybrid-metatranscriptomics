name: "enrichment"
description: "GO + KEGG over-representation and GO GSEA per contrast, against the pipeline's own annotation."
keywords:
  - enrichment
  - transcriptomics
  - assembly
tools:
  - "bioconductor-deseq2":
      description: "bioconductor-deseq2"
      licence: []
  - "bioconductor-tximport":
      description: "bioconductor-tximport"
      licence: []
  - "bioconductor-apeglm":
      description: "bioconductor-apeglm"
      licence: []
  - "r-ashr":
      description: "r-ashr"
      licence: []
  - "bioconductor-clusterprofiler":
      description: "bioconductor-clusterprofiler"
      licence: []
  - "bioconductor-go.db":
      description: "bioconductor-go.db"
      licence: []
  - "r-ggplot2":
      description: "r-ggplot2"
      licence: []
input:
  - - "meta":
          type: map
          description: "meta"
    - "dge_dir":
          type: file
          description: "dge_dir"
  - - "meta2":
          type: map
          description: "meta2"
    - "annotation":
          type: file
          description: "annotation"
output:
  results:
    - - "meta":
            type: map
            description: "meta"
      - "enrichment_${meta.id}":
            type: file
            description: "enrichment_${meta.id}"
  versions:
    - "versions.yml":
        type: file
        description: "versions.yml"
authors:
  - "@bioinfo-kaust"
maintainers:
  - "@bioinfo-kaust"
