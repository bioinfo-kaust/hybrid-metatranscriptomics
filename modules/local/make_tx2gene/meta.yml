name: "make_tx2gene"
description: "The string-stripped transcript -> gene map: per-source rules ('prefix:isoform_suffix_regex', first match wins) applied to the transcript ids."
keywords:
  - make
  - tx2gene
  - transcriptomics
tools:
  - "python":
      description: "python"
      licence: []
  - "gawk":
      description: "gawk"
      licence: []
input:
  - - "meta":
          type: map
          description: "meta"
    - "fasta":
          type: file
          description: "fasta"
output:
  tx2gene:
    - - "meta":
            type: map
            description: "meta"
      - "tx2gene.${meta.id}.tsv":
            type: file
            description: "tx2gene.${meta.id}.tsv"
  versions:
    - "versions.yml":
        type: file
        description: "versions.yml"
authors:
  - "@bioinfo-kaust"
maintainers:
  - "@bioinfo-kaust"
